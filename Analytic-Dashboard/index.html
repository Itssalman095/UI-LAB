<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zystria — Scale with Precision</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stage">
  <div class="card-wrap">
    <div class="card" id="mainCard">
      <h1 class="headline">SCALE WITH<br>PRECISION.</h1>

      <div class="panel">
        <div class="rail">
          <button class="active" title="Users">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          </button>
          <button title="Search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          </button>
          <button title="History">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          </button>
          <button title="Analytics">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>
          </button>
          <button title="List">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          </button>
          <button title="Settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
        </div>

        <div class="content">
          <div class="stat-row">
            <div>
              <div class="stat-label">Active Users</div>
              <div class="stat-value">20,633</div>
            </div>
            <div>
              <div class="stat-label">Annual Growth</div>
              <div class="stat-value accent">+16.32%</div>
            </div>
          </div>
          <div class="stat-col" style="margin-bottom:8px;">
            <div>
              <div class="stat-label">Monthly Growth</div>
              <div class="stat-value accent">+1.36%</div>
            </div>
          </div>

          <div class="chart-wrap" id="chartWrap">
            <svg id="chartSvg" viewBox="0 0 420 220" preserveAspectRatio="none">
              <defs>
                <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#6b2bef" stop-opacity="0.55"/>
                  <stop offset="45%" stop-color="#3a1670" stop-opacity="0.4"/>
                  <stop offset="100%" stop-color="#000000" stop-opacity="0.08"/>
                </linearGradient>
                <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
                  <feGaussianBlur stdDeviation="4" result="blur"/>
                  <feMerge>
                    <feMergeNode in="blur"/>
                    <feMergeNode in="SourceGraphic"/>
                  </feMerge>
                </filter>
              </defs>

              <!-- gridlines -->
              <g id="gridLines" stroke="rgba(255,255,255,0.08)" stroke-width="1"></g>

              <!-- secondary dim line -->
              <path id="lineDim" fill="none" stroke="#431c99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

              <!-- area under main line -->
              <path id="areaPath" fill="url(#areaFill)" stroke="none"/>

              <!-- main glowing line -->
              <path id="lineMain" fill="none" stroke="#d9cbfc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

              <g id="dots"></g>
            </svg>
            <div class="tooltip" id="tooltip">
              <div class="t-month" id="ttMonth"></div>
              <div class="t-val" id="ttVal"></div>
            </div>
          </div>

          <div class="bottom-row">
            <div class="bottom-item">
              <div class="icon-badge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="5" x2="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>
              </div>
              <div>
                <div class="bi-label">Conversions</div>
                <div class="bi-value">300.27%</div>
              </div>
            </div>
            <div class="bottom-item">
              <div class="icon-badge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v12M15 9.5c0-1.38-1.34-2.5-3-2.5s-3 1.12-3 2.5 1.34 2.5 3 2.5 3 1.12 3 2.5-1.34 2.5-3 2.5-3-1.12-3-2.5"/></svg>
              </div>
              <div>
                <div class="bi-label">Quarterly Revenue</div>
                <div class="bi-value">$40,006.37 <span class="up">+36%</span></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- reflection: mirrors the card straight down, cropped and fading like water -->
    <div class="reflection-mask">
      <div class="glow-floor"></div>
      <div class="reflection" id="reflection" aria-hidden="true"></div>
    </div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
