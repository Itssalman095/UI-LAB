<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact UI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="page">

        <!-- Navbar -->
        <header class="navbar">

            <div class="logo">
                <span class="logo-icon">
                    <i></i>
                    <i></i>
                    <i></i>
                    <i></i>
                </span>

                <span>Space</span>
            </div>

            <nav>
                <a href="#">Home</a>
                <a href="#">Product</a>
                <a href="#">Pricing</a>
                <a href="#">Plans</a>
                <a href="#">Contact</a>
            </nav>

            <a href="#" class="start-btn">Get Started</a>

        </header>


        <!-- Contact Card -->
        <main class="contact-wrapper">

            <div class="contact-card">

                <div class="heading">
                    <h1>Let's Have A Chat</h1>

                    <p>
                        Questions About Our Products/Services, Orders Or Just
                        <br>
                        Want To Say Hello? We're Here To Help!
                    </p>
                </div>


                <form>

                    <div class="form-row">

                        <div class="field">
                            <label>First name</label>
                            <input type="text" placeholder="Stephen">
                        </div>

                        <div class="field">
                            <label>Last name</label>
                            <input type="text" placeholder="Ahmed">
                        </div>

                    </div>


                    <div class="form-row">

                        <div class="field">
                            <label>Email</label>
                            <input type="email" placeholder="askstephenahmed@gmail.com">
                        </div>

                        <div class="field">
                            <label>Phone Number</label>
                            <input type="text" placeholder="+8801780000000">
                        </div>

                    </div>


                    <div class="field message-field">
                        <label>Message</label>

                        <textarea
                            placeholder="Hey! I have some questions about the products and services."
                        ></textarea>
                    </div>


                    <button type="submit">
                        Send Message
                    </button>

                </form>

            </div>

        </main>

    </div>

</body>
</html>
