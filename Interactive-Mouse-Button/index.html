<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Interactive Monster Button</title>

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <button type="button" aria-label="Interactive monster button">

    <svg
      viewBox="0 0 242 109"
      xmlns="http://www.w3.org/2000/svg"
      xmlns:xlink="http://www.w3.org/1999/xlink"
    >

      <!-- EARS -->
      <g class="ears">

        <g class="ear-left">
          <ellipse
            class="ear-left-outer"
            transform="matrix(0.9391 -0.3436 0.3436 0.9391 -3.6062 17.8444)"
            cx="48.5"
            cy="19.1"
            rx="11.4"
            ry="13.8"
          />

          <ellipse
            class="ear-left-inner"
            transform="matrix(0.9391 -0.3436 0.3436 0.9391 -3.8876 17.4659)"
            cx="47.3"
            cy="19.7"
            rx="7.3"
            ry="11.2"
          />
        </g>

        <g class="ear-right">
          <ellipse
            class="ear-right-outer"
            transform="matrix(0.3436 -0.9391 0.9391 0.3436 106.5379 189.869)"
            cx="189.1"
            cy="18.7"
            rx="14.4"
            ry="11.9"
          />

          <ellipse
            class="ear-right-inner"
            transform="matrix(0.3436 -0.9391 0.9391 0.3436 106.8522 191.5127)"
            cx="190.4"
            cy="19.3"
            rx="11.7"
            ry="7.7"
          />
        </g>

      </g>


      <!-- EYES -->
      <g class="eyes">

        <defs>
          <clipPath id="eyeRightClip">
            <path d="
              M175,25
              c0-11-7.8-20-17.5-20
              S140,14,140,25
              c0,0.7,0,1.3,0.1,2
              h34.8
              C175,26.3,175,25.7,175,25z
            "/>
          </clipPath>
        </defs>

        <g class="eye-right">

          <path
            class="eye-right-outer"
            d="
              M174.9,27H186
              c0-0.3,0-0.7,0-1
              c0-14.4-11.6-26-26-26
              c-14.4,0-26,11.6-26,26
              c0,0.3,0,0.7,0,1
              h6.1H174.9z
            "
          />

          <path
            class="eye-right-inner"
            d="
              M175,25
              c0-11-7.8-20-17.5-20
              S140,14,140,25
              c0,0.7,0,1.3,0.1,2
              h34.8
              C175,26.3,175,25.7,175,25z
            "
          />

          <g clip-path="url(#eyeRightClip)">
            <circle
              class="eye-right-pupil"
              cx="158"
              cy="18"
              r="5"
            />
          </g>

        </g>


        <defs>
          <clipPath id="eyeLeftClip">
            <path d="
              M97,25
              c0-11-7.8-20-17.5-20
              S62,14,62,25
              c0,0.7,0,1.3,0.1,2
              h34.8
              C97,26.3,97,25.7,97,25z
            "/>
          </clipPath>
        </defs>


        <g class="eye-left">

          <path
            class="eye-left-outer"
            d="
              M96.9,27h6.1
              c0-0.3,0-0.7,0-1
              c0-14.4-11.6-26-26-26
              C62.6,0,51,11.6,51,26
              c0,0.3,0,0.7,0,1
              h11.1H96.9z
            "
          />

          <path
            class="eye-left-inner"
            d="
              M97,25
              c0-11-7.8-20-17.5-20
              S62,14,62,25
              c0,0.7,0,1.3,0.1,2
              h34.8
              C97,26.3,97,25.7,97,25z
            "
          />

          <g clip-path="url(#eyeLeftClip)">
            <circle
              class="eye-left-pupil"
              cx="80"
              cy="17.7"
              r="5"
            />
          </g>

        </g>

      </g>


      <!-- NOSTRILS -->
      <g class="nostrils">

        <g class="nostril-right">
          <ellipse
            class="nostril-right-outer"
            cx="130.5"
            cy="27.5"
            rx="6.5"
            ry="5.5"
          />

          <circle
            class="nostril-right-inner"
            cx="130"
            cy="28"
            r="4"
          />
        </g>

        <g class="nostril-left">
          <ellipse
            class="nostril-left-outer"
            cx="106.5"
            cy="27.5"
            rx="6.5"
            ry="5.5"
          />

          <circle
            class="nostril-left-inner"
            cx="107"
            cy="28"
            r="4"
          />
        </g>

      </g>


      <!-- BODY -->
      <path
        class="body"
        d="
          M218,98H24
          C10.8,98,0,87.2,0,74
          V51
          c0-13.2,10.8-24,24-24
          h194
          c13.2,0,24,10.8,24,24
          v23
          C242,87.2,231.2,98,218,98z
        "
      />


      <!-- FRECKLES -->
      <g class="freckles">

        <circle
          class="freckle"
          cx="13.7"
          cy="41.4"
          r="1.6"
        />

        <circle
          class="freckle"
          cx="20.1"
          cy="44.7"
          r="1.6"
        />

        <circle
          class="freckle"
          cx="19.6"
          cy="37.8"
          r="1.6"
        />

      </g>


      <!-- MOUTH CLIP -->
      <defs>
        <clipPath id="mouthClip">
          <path d="
            M218,98H24
            C10.8,98,0,87.2,0,74
            V51
            c0-13.2,10.8-24,24-24
            h194
            c13.2,0,24,10.8,24,24
            v23
            C242,87.2,231.2,98,218,98z
          "/>
        </clipPath>
      </defs>


      <!-- MOUTH -->
      <g
        class="mouth"
        clip-path="url(#mouthClip)"
      >

        <g class="mouth-pieces">

          <path
            class="mouth-back"
            d="
              M23.6,168.2
              l-3-56.1
              c0-7.8,6.4-14.1,14.1-14.1
              h172.4
              c7.8,0,14.1,6.4,14.1,14.1
              l-3,56.1
            "
          />

          <path
            class="tongue"
            d="
              M174.9,168.2
              c-7.3-5-24.5-9.9-54.8-9.9
              s-48,5.1-54.8,9.9
            "
          />

        </g>

      </g>


      <!-- TEETH -->
      <g class="teeth">

        <path
          class="tooth-left"
          d="
            M115,97.9
            v7.5
            c0,2-1.7,3.6-3.6,3.6
            H89.7
            c-2,0-3.6-1.7-3.6-3.6
            v-7.5H115z
          "
        />

        <path
          class="tooth-right"
          d="
            M154,97.9
            v7.5
            c0,2-1.7,3.6-3.6,3.6
            h-21.7
            c-2,0-3.6-1.7-3.6-3.6
            v-7.5H154z
          "
        />

      </g>

    </svg>

  </button>
  
<script src="script.js"></script>
</body>
</html>
