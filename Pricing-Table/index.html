<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Glowing Card</title>

    <!-- Remix Icon -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet" />

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="card">
        <div class="card-border"></div>
        <div class="title-container">
            <span class="title">
                Premium UI Pack
            </span>
            <p class="para">Modern animated components with smooth effects and clean design.
            </p>
        </div>

        <hr class="line">
        <ul class="card-list">

            <li class="list-item">
                <span class="check">
                    <i class="ri-check-line"></i>
                </span>
                <span class="text">Premium UI Design</span>
            </li>

            <li class="list-item">
                <span class="check">
                    <i class="ri-check-line"></i>
                </span>
                <span class="text">Responsive Layout</span>
            </li>

            <li class="list-item">
                <span class="check">
                    <i class="ri-check-line"></i>
                </span>
                <span class="text">Smooth Animation</span>
            </li>

            <li class="list-item">
                <span class="check">
                    <i class="ri-check-line"></i>
                </span>
                <span class="text">Clean Source</span>
            </li>

            <li class="list-item">
                <span class="check">
                    <i class="ri-check-line"></i>
                </span>
                <span class="text">24/7 Support</span>
            </li>
        </ul>

        <button class="button">Get Started</button>
    </div>
</body>

</html>
