<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radial Menu</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="header">
    <p class="eyebrow">Frontend<br>Challenge Day – #</p>
    <h1>Radial Menu</h1>
  </div>

  <div class="stage">

    <div class="navbar">
      <button class="nav-item active home-icon" id="homeBtn">
        <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
        <span>Home</span>
      </button>

      <button class="nav-item" id="profileBtn">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg>
        <span>Profile</span>
      </button>

      <div class="home-dot"></div>

    </div>

    <div class="radial">
      <input type="checkbox" id="menu-toggle">
      <label for="menu-toggle" class="menu-btn">
        <span class="bar h"></span>
        <span class="bar v"></span>
      </label>

      <button class="menu-item phone" data-name="Phone">
        <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      </button>
      <button class="menu-item mail" data-name="Mail">
        <svg viewBox="0 0 24 24"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h13A2.5 2.5 0 0 1 21 6.5v11A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5v-11z"/><path d="M4 6l8 6 8-6" fill="none" stroke="var(--accent)" stroke-width="1.6"/></svg>
      </button>
      <button class="menu-item mic" data-name="Mic">
        <svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><path d="M12 18v4"/><path d="M8 22h8"/></svg>
      </button>

    
    </div>

  </div>

  <div class="footer-hint">Tap the center button to open / close</div>

<script src="script.js"></script>
</body>
</html>
